aws:
  # Default AWS region to use
  default_region: eu-west-1

  # Refresh interval for EC2 instance data (in seconds)
  refresh_interval: 30s

  # Optional AWS profile to use
  # If not specified, the default credentials chain will be used
  profile: ""

ui:
  # Color theme: nord (default) or gruvbox.
  # Overridden by --theme. An unknown name is an error, not a silent fallback.
  theme: nord

  # Optionally override individual colors of the selected theme.
  # Values are "#rrggbb" or a color name. Valid keys:
  #   background, foreground, border, title, selected, header_fg, header_bg,
  #   running, stopped, pending, error, highlight, secondary
  # colors:
  #   running: "#b8bb26"
  #   stopped: "#fb4934"

  # Compact mode reduces whitespace in the UI
  compact: false
